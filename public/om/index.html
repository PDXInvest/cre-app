<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Offering Memorandum — Templated</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&display=swap" rel="stylesheet" />

<style>
/* ============================================================
   BASE — tokens, body, page chrome
   Lifted directly from the original Offering Memorandum.html so
   the templated version matches the visual language 1:1.
   ============================================================ */
:root {
  --burgundy:   #A51123;
  --red:        #E20A24;
  --charcoal-1: #1a1a1a;
  --charcoal-2: #3a3a3a;
  --charcoal-3: #6b6b6b;
  --grey-1:     #f5f3ee;
  --grey-2:     #e8e6e0;
  --grey-3:     #cfcdc7;
  --paper:      #ffffff;
  --accent:     var(--burgundy);

  /* Letter landscape @ 96dpi */
  --page-w: 1056px;
  --page-h: 816px;
  --page-pad: 64px;

  --sans:  "Montserrat", "Futura", "Helvetica Neue", system-ui, sans-serif;
  --serif: "DM Serif Display", Georgia, serif;
}

* { box-sizing: border-box; }
html, body {
  margin: 0; padding: 0;
  background: #f0ede6;
  color: var(--charcoal-1);
  font-family: var(--sans);
  font-weight: 400;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

/* ============================================================
   STAGE — vertical stack of pages, centered
   ============================================================ */
.om-stage {
  padding: 32px 0 96px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 24px;
  min-height: 100vh;
}
body[data-view="client"] .om-stage { padding-bottom: 32px; }

.om-page {
  position: relative;
  width: var(--page-w);
  height: var(--page-h);
  padding: var(--page-pad);
  background: var(--paper);
  overflow: hidden;
  box-shadow: 0 16px 48px -16px rgba(0,0,0,0.18), 0 4px 12px -4px rgba(0,0,0,0.08);
}

/* Running header / footer — hidden on screen, restored on print. */
.om-page .page-header,
.om-page .page-footer {
  display: none;
  position: absolute;
  left: 32px; right: 32px;
  font-size: 9.5px;
  letter-spacing: 0.24em;
  text-transform: uppercase;
  font-weight: 600;
  justify-content: space-between;
  align-items: center;
  color: var(--charcoal-3);
}
.om-page .page-header { top: 32px; }
.om-page .page-footer { bottom: 32px; }
.om-page.is-dark .page-header,
.om-page.is-dark .page-footer { color: rgba(255,255,255,0.55); }
.om-page .page-footer .pn { font-variant-numeric: tabular-nums; font-weight: 600; color: var(--accent); }

/* ============================================================
   SHARED TYPE — eyebrow, title, body, lead, block rule
   ============================================================ */
.h-eyebrow {
  font-size: 11px;
  letter-spacing: 0.28em;
  text-transform: uppercase;
  font-weight: 600;
  color: var(--accent);
  margin: 0;
}
.h-title {
  font-family: var(--serif);
  font-size: 38px;
  line-height: 1.04;
  letter-spacing: -0.01em;
  font-weight: 400;
  color: var(--charcoal-1);
  margin: 8px 0 0;
  text-wrap: balance;
}
.p-body {
  font-size: 13.5px;
  line-height: 1.62;
  color: var(--charcoal-2);
  margin: 0;
  text-wrap: pretty;
}
.p-body strong { color: var(--charcoal-1); font-weight: 600; }
.p-lead {
  font-size: 15px;
  line-height: 1.55;
  color: var(--charcoal-2);
  margin: 0;
}
.block-rule {
  width: 56px;
  height: 4px;
  background: var(--accent);
  border: none;
  margin: 0;
}

/* ============================================================
   COVER TEMPLATE
   ============================================================ */
.om-page.cover {
  padding: 0;
  background: var(--charcoal-1);
  color: #fff;
  display: grid;
  grid-template-rows: 1fr auto;
}
.cover .cover-image { position: relative; overflow: hidden; }
.cover .cover-image image-slot { width: 100%; height: 100%; display: block; }
.cover .cover-image::after {
  content: "";
  position: absolute; inset: 0;
  background: linear-gradient(180deg, rgba(0,0,0,0.40) 0%, rgba(0,0,0,0) 30%, rgba(0,0,0,0) 50%, rgba(0,0,0,0.55) 100%);
  pointer-events: none;
}
.cover .cover-mast {
  position: absolute;
  top: 48px; left: 48px; right: 48px;
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  z-index: 2;
}
.cover .cover-mast .badge {
  font-size: 10px;
  letter-spacing: 0.32em;
  text-transform: uppercase;
  font-weight: 700;
  color: #fff;
  padding: 6px 12px;
  border: 1px solid rgba(255,255,255,0.45);
}
.cover .cover-mast .stamp {
  text-align: right;
  font-family: var(--serif);
  font-size: 22px;
  color: #fff;
  line-height: 1.05;
}
.cover .cover-mast .stamp .accent { color: var(--accent); font-style: italic; }
.cover .cover-mast .stamp .sub {
  display: block;
  font-family: var(--sans);
  font-size: 10px;
  letter-spacing: 0.32em;
  text-transform: uppercase;
  color: rgba(255,255,255,0.7);
  font-weight: 500;
  margin-top: 8px;
}
.cover .cover-title {
  position: absolute;
  left: 48px;
  bottom: 150px;
  max-width: 720px;
  color: #fff;
  z-index: 2;
}
.cover .cover-title .kicker {
  display: inline-block;
  background: var(--accent);
  color: #fff;
  font-size: 10px;
  letter-spacing: 0.32em;
  text-transform: uppercase;
  font-weight: 700;
  padding: 6px 12px;
  margin-bottom: 22px;
}
.cover .cover-title h1 {
  font-family: var(--serif);
  font-size: 76px;
  line-height: 0.98;
  font-weight: 400;
  letter-spacing: -0.015em;
  margin: 0;
  text-wrap: balance;
}
.cover .cover-title .lede {
  font-size: 17px;
  line-height: 1.35;
  color: rgba(255,255,255,0.85);
  max-width: 560px;
  margin: 22px 0 0;
}
.cover .cover-foot {
  position: relative;
  background: #0e0e0e;
  padding: 28px 48px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  z-index: 2;
  border-top: 4px solid var(--accent);
}
.cover .cover-foot .label {
  font-size: 10px;
  letter-spacing: 0.3em;
  text-transform: uppercase;
  font-weight: 600;
  color: rgba(255,255,255,0.55);
  margin: 0 0 6px;
}
.cover .cover-foot .addr {
  font-size: 14px;
  color: #fff;
  margin: 0;
  letter-spacing: 0.04em;
}
.cover .cover-foot .right { text-align: right; }
.cover .cover-foot .right .price {
  font-family: var(--serif);
  font-size: 28px;
  color: #fff;
  margin: 0;
  letter-spacing: -0.01em;
}

/* ============================================================
   NARRATIVE TEMPLATE
   ============================================================ */
.om-page.narrative {
  padding-top: 84px;
  padding-bottom: 80px;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 36px;
  align-items: stretch;
}
.narrative .photo {
  height: auto;
  margin-top: 4px;
  background: var(--grey-2);
}
.narrative .photo image-slot { width: 100%; height: 100%; display: block; }
.narrative blockquote {
  margin: 24px 0 0;
  padding: 0 0 0 16px;
  border-left: 3px solid var(--accent);
  font-family: var(--serif);
  font-size: 18px;
  line-height: 1.35;
  color: var(--charcoal-1);
  font-style: italic;
}
.narrative .stats {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px;
  margin-top: 22px;
}
.narrative .stat {
  padding: 14px 16px;
  background: var(--grey-1);
}
.narrative .stat .n {
  font-family: var(--serif);
  font-size: 28px;
  line-height: 1;
  color: var(--accent);
  margin: 0;
}
.narrative .stat .l {
  font-size: 10px;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  font-weight: 600;
  color: var(--charcoal-3);
  margin: 8px 0 0;
  line-height: 1.35;
}

/* ============================================================
   TABLE TEMPLATE (comps-summary class re-used)
   ============================================================ */
.om-page.comps-summary {
  padding-top: 84px;
  padding-bottom: 70px;
}
.comps-summary table {
  width: 100%;
  border-collapse: collapse;
  margin-top: 22px;
  table-layout: auto;
}
.comps-summary table thead th {
  text-align: right;
  font-size: 9px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  font-weight: 700;
  color: var(--charcoal-3);
  padding: 8px;
  border-bottom: 2px solid var(--charcoal-1);
  white-space: nowrap;
}
.comps-summary table thead th:first-child,
.comps-summary table thead th:nth-child(2),
.comps-summary table thead th:nth-child(3) { text-align: left; }
.comps-summary table tbody td {
  padding: 9px 8px;
  border-bottom: 1px solid var(--grey-2);
  text-align: right;
  font-variant-numeric: tabular-nums;
  color: var(--charcoal-2);
  font-size: 11px;
}
.comps-summary table tbody td:first-child,
.comps-summary table tbody td:nth-child(2),
.comps-summary table tbody td:nth-child(3) { text-align: left; }
.comps-summary table tbody td:first-child {
  font-weight: 700;
  color: var(--accent);
  width: 28px;
}
.comps-summary table tbody td .sub {
  font-weight: 500;
  color: var(--charcoal-3);
  font-size: 10px;
  margin-left: 4px;
}
.comps-summary table tbody tr.is-subject {
  background: rgba(165,17,35,0.06);
}
.comps-summary table tbody tr.is-subject td {
  color: var(--charcoal-1);
  font-weight: 600;
}
.comps-summary table tbody tr.is-subject td:first-child { color: var(--accent); }
.comps-summary table tbody tr.is-avg td {
  font-weight: 700;
  color: var(--charcoal-1);
  border-top: 1px solid var(--charcoal-1);
  border-bottom: none;
  padding-top: 12px;
}

/* ============================================================
   CARD GRID TEMPLATE (comps-detail class re-used)
   ============================================================ */
.om-page.comps-detail {
  padding-top: 72px;
  padding-bottom: 60px;
}
.comps-detail .cards {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 18px;
  margin-top: 22px;
}
.comp-card {
  display: flex;
  flex-direction: column;
  border-top: 3px solid var(--charcoal-1);
}
.comp-card.is-subject { border-top-color: var(--accent); }
.comp-card .photo { height: 130px; background: var(--grey-2); }
.comp-card .photo image-slot { width: 100%; height: 100%; display: block; }
.comp-card .body { padding: 12px 0 0; }
.comp-card .label {
  font-size: 8.5px;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  font-weight: 700;
  color: var(--charcoal-3);
  margin: 0 0 4px;
}
.comp-card.is-subject .label { color: var(--accent); }
.comp-card h3 {
  margin: 0;
  font-family: var(--serif);
  font-size: 14px;
  line-height: 1.15;
  font-weight: 400;
  color: var(--charcoal-1);
  letter-spacing: -0.005em;
}
.comp-card .addr {
  font-size: 11px;
  color: var(--charcoal-3);
  margin: 2px 0 10px;
}
.comp-card dl {
  margin: 0;
  display: grid;
  grid-template-columns: 1fr 1fr;
  column-gap: 12px;
  border-top: 1px solid var(--grey-2);
  padding-top: 8px;
}
.comp-card dl > div {
  display: flex;
  justify-content: space-between;
  font-size: 10.5px;
  border-bottom: 1px dotted var(--grey-3);
  padding-bottom: 3px;
}
.comp-card dt {
  color: var(--charcoal-3);
  font-weight: 500;
}
.comp-card dd {
  margin: 0;
  color: var(--charcoal-1);
  font-weight: 700;
  font-variant-numeric: tabular-nums;
}

/* ============================================================
   DATA PANE — floating JSON editor (editor view only)
   ============================================================ */
.data-pane {
  position: fixed;
  right: 24px;
  bottom: 24px;
  z-index: 1000;
  font-family: var(--sans);
}
.dp-toggle {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  padding: 12px 18px;
  background: var(--charcoal-1);
  color: #fff;
  border: none;
  border-radius: 999px;
  font-family: inherit;
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  cursor: pointer;
  box-shadow: 0 12px 32px -12px rgba(0,0,0,0.4), 0 4px 12px -4px rgba(0,0,0,0.2);
  transition: transform 0.15s ease, box-shadow 0.15s ease;
}
.dp-toggle:hover { transform: translateY(-1px); box-shadow: 0 16px 40px -12px rgba(0,0,0,0.45), 0 6px 14px -4px rgba(0,0,0,0.25); }
.dp-toggle-dot {
  display: inline-block;
  width: 8px; height: 8px;
  background: var(--accent);
  border-radius: 50%;
}
.dp-toggle-meta {
  color: rgba(255,255,255,0.55);
  font-weight: 500;
  letter-spacing: 0.12em;
  font-size: 10px;
  padding-left: 6px;
  border-left: 1px solid rgba(255,255,255,0.2);
}
.data-pane.is-open .dp-toggle { display: none; }

.dp-body {
  width: 520px;
  max-width: calc(100vw - 48px);
  max-height: calc(100vh - 48px);
  background: #fff;
  border-radius: 12px;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  box-shadow: 0 24px 56px -16px rgba(0,0,0,0.35), 0 8px 20px -6px rgba(0,0,0,0.18);
  border: 1px solid var(--grey-2);
}
.dp-head {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  padding: 18px 20px 14px;
  border-bottom: 1px solid var(--grey-2);
}
.dp-title {
  font-family: var(--serif);
  font-size: 18px;
  color: var(--charcoal-1);
  margin: 0;
}
.dp-sub {
  font-size: 11px;
  color: var(--charcoal-3);
  margin: 4px 0 0;
  letter-spacing: 0.01em;
}
.dp-close {
  border: none;
  background: transparent;
  font-size: 24px;
  line-height: 1;
  cursor: pointer;
  color: var(--charcoal-3);
  padding: 0 4px;
}
.dp-close:hover { color: var(--charcoal-1); }
.dp-textarea {
  flex: 1;
  width: 100%;
  min-height: 320px;
  max-height: 50vh;
  padding: 14px 16px;
  font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  font-size: 11px;
  line-height: 1.5;
  color: var(--charcoal-1);
  background: #fbfaf6;
  border: none;
  resize: vertical;
  outline: none;
}
.dp-textarea:focus { background: #fff; }
.dp-error {
  margin: 0;
  padding: 10px 16px;
  font-size: 11px;
  color: var(--accent);
  background: rgba(165,17,35,0.06);
  border-top: 1px solid rgba(165,17,35,0.18);
  font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
.dp-actions {
  display: flex;
  gap: 8px;
  padding: 12px 16px;
  border-top: 1px solid var(--grey-2);
  background: var(--grey-1);
}
.dp-btn {
  padding: 8px 16px;
  border-radius: 6px;
  font-family: inherit;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  cursor: pointer;
  border: 1px solid transparent;
  transition: background 0.12s ease;
}
.dp-btn-primary {
  background: var(--charcoal-1);
  color: #fff;
}
.dp-btn-primary:hover { background: var(--charcoal-2); }
.dp-btn-secondary {
  background: transparent;
  color: var(--charcoal-2);
  border-color: var(--grey-3);
}
.dp-btn-secondary:hover { background: #fff; }

.dp-flash {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 10.5px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  font-weight: 600;
  color: #1f7a3f;
  padding: 8px 12px;
  background: rgba(31,122,63,0.08);
  border-radius: 6px;
  animation: dpFlashIn 0.18s ease-out;
}
.dp-flash-dot {
  width: 6px; height: 6px;
  border-radius: 50%;
  background: #1f7a3f;
  box-shadow: 0 0 0 0 rgba(31,122,63,0.5);
  animation: dpFlashPulse 1s ease-out;
}
@keyframes dpFlashIn {
  from { opacity: 0; transform: translateY(2px); }
  to   { opacity: 1; transform: translateY(0); }
}
@keyframes dpFlashPulse {
  0%   { box-shadow: 0 0 0 0 rgba(31,122,63,0.5); }
  100% { box-shadow: 0 0 0 8px rgba(31,122,63,0); }
}

/* ============================================================
   BULLETS + PHOTO TEMPLATE
   ============================================================ */
.om-page.bullets-photo {
  padding-top: 84px;
  padding-bottom: 80px;
  display: grid;
  grid-template-columns: 1.1fr 1fr;
  gap: 40px;
  align-items: stretch;
}
.bullets-photo .photo { background: var(--grey-2); margin-top: 4px; }
.bullets-photo .photo image-slot { width: 100%; height: 100%; display: block; }
.bullets-photo .bp-list { list-style: none; margin: 24px 0 0; padding: 0; }
.bullets-photo .bp-list li { padding: 14px 0; border-bottom: 1px solid var(--grey-2); }
.bullets-photo .bp-list li:first-child { padding-top: 0; }
.bullets-photo .bp-headline {
  font-family: var(--serif); font-size: 17px; line-height: 1.2;
  color: var(--charcoal-1); margin: 0;
}
.bullets-photo .bp-desc { font-size: 12.5px; line-height: 1.5; color: var(--charcoal-2); margin: 5px 0 0; }

/* ============================================================
   PHOTO DETAIL TEMPLATE
   ============================================================ */
.om-page.photo-detail { padding: 0; display: grid; grid-template-rows: 1fr auto; }
.photo-detail .pd-photo { position: relative; overflow: hidden; background: var(--grey-2); }
.photo-detail .pd-photo image-slot { width: 100%; height: 100%; display: block; }
.photo-detail .pd-body { padding: 32px 48px 40px; }
.photo-detail .pd-head { margin-bottom: 18px; }
.photo-detail .pd-specs {
  display: grid; grid-template-columns: repeat(4, 1fr);
  gap: 0 28px; margin: 0;
}
.photo-detail .pd-specs > div {
  display: flex; justify-content: space-between; align-items: baseline;
  padding: 9px 0; border-bottom: 1px dotted var(--grey-3);
}
.photo-detail .pd-specs dt {
  font-size: 9px; letter-spacing: 0.16em; text-transform: uppercase;
  font-weight: 600; color: var(--charcoal-3);
}
.photo-detail .pd-specs dd {
  margin: 0; font-size: 13px; font-weight: 700; color: var(--charcoal-1);
  font-variant-numeric: tabular-nums;
}

/* ============================================================
   STAT TILES TEMPLATE
   ============================================================ */
.om-page.stat-tiles { padding-top: 84px; padding-bottom: 70px; }
.stat-tiles .st-grid { display: grid; gap: 14px; margin-top: 24px; }
.stat-tiles .st-tile { padding: 18px 16px; background: var(--grey-1); border-top: 3px solid var(--accent); }
.stat-tiles .st-value {
  font-family: var(--serif); font-size: 34px; line-height: 1;
  color: var(--charcoal-1); margin: 0;
}
.stat-tiles .st-label {
  font-size: 11px; line-height: 1.4; color: var(--charcoal-2);
  margin: 10px 0 0; font-weight: 500;
}
.stat-tiles .st-source {
  font-size: 9px; letter-spacing: 0.14em; text-transform: uppercase;
  color: var(--charcoal-3); margin: 8px 0 0; font-weight: 600;
}
.stat-tiles .st-charts-note { font-size: 11px; color: var(--charcoal-3); margin-top: 18px; font-style: italic; }

/* ============================================================
   FINANCIAL SUMMARY TEMPLATE
   ============================================================ */
.om-page.financial-summary { padding-top: 84px; padding-bottom: 64px; }
.financial-summary .fs-totals {
  display: grid; grid-template-columns: repeat(5, 1fr);
  gap: 12px; margin-top: 22px;
}
.financial-summary .fs-total { padding: 14px 16px; background: var(--grey-1); }
.financial-summary .fs-total .l {
  font-size: 9px; letter-spacing: 0.18em; text-transform: uppercase;
  font-weight: 600; color: var(--charcoal-3); margin: 0;
}
.financial-summary .fs-total .n {
  font-family: var(--serif); font-size: 24px; color: var(--charcoal-1);
  margin: 6px 0 0; font-variant-numeric: tabular-nums;
}
.financial-summary .fs-tables { display: grid; grid-template-columns: 1fr 1fr; gap: 28px; margin-top: 24px; }
.financial-summary .fs-table { width: 100%; border-collapse: collapse; }
.financial-summary .fs-table caption {
  text-align: left; font-size: 10px; letter-spacing: 0.2em;
  text-transform: uppercase; font-weight: 700; color: var(--accent);
  margin-bottom: 8px;
}
.financial-summary .fs-table th {
  text-align: right; font-size: 8.5px; letter-spacing: 0.12em;
  text-transform: uppercase; font-weight: 700; color: var(--charcoal-3);
  padding: 6px; border-bottom: 2px solid var(--charcoal-1); white-space: nowrap;
}
.financial-summary .fs-table th:first-child { text-align: left; }
.financial-summary .fs-table td {
  padding: 7px 6px; border-bottom: 1px solid var(--grey-2);
